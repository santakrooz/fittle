<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fittle</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-ui); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .amber { fill:var(--accent); }
  .orange { fill:var(--nebula-orange); }
  .teal { fill:var(--nebula-teal); }
  .rose { fill:var(--nebula-rose); }
  .slab { fill:var(--line-strong); }
  .pill { fill:var(--surface-2); }
  .pill.lit { fill:var(--accent); }
  .words { position:absolute; left:28px; bottom:28px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:112px; line-height:.92; font-weight:700; letter-spacing:-.02em; color:var(--text); }
  .tag { margin:10px 0 0 4px; font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 112x236 slab bled off the top (the one amber light, largest) · line-strong 236x176 stage slab · nebula-orange 112x64 · nebula-teal 64x96 · nebula-rose 48x48 (clipping only, smallest) — about 40% of 960x288
  arrangement one tall amber slab with satellites; bottoms on one line space-28 above the edge; gutters space-14
  pattern     pills, from "Controls are pills": a floating toolbar of 30px-tall pills (layout-control) at a space-4 gap across the stage slab, one lit in accent, a second loose row below
  scales      gutters space-14, pitch space-4, pill height layout-control (30) with rx 15 (half the short side), blocks radius-card (14)
-->
<rect class="amber" x="0" y="-14" width="112" height="274" rx="14"/>
<rect class="slab" x="126" y="84" width="236" height="176" rx="14"/>
<rect class="orange" x="376" y="196" width="112" height="64" rx="14"/>
<rect class="teal" x="376" y="86" width="64" height="96" rx="14"/>
<rect class="rose" x="376" y="22" width="48" height="48" rx="14"/>
<rect class="pill lit" x="140" y="100" width="72" height="30" rx="15"/>
<rect class="pill" x="216" y="100" width="56" height="30" rx="15"/>
<rect class="pill" x="276" y="100" width="72" height="30" rx="15"/>
<rect class="pill" x="140" y="134" width="30" height="30" rx="15"/>
<rect class="pill" x="174" y="134" width="44" height="30" rx="15"/>
<rect class="pill" x="222" y="134" width="30" height="30" rx="15"/>
<rect class="pill" x="256" y="134" width="44" height="30" rx="15"/>
</svg>
</div>
<div class="words">
<h1 class="name">Fittle</h1>
<p class="tag">Deep-space dark, one amber light, the image as the hero.</p>
</div>
</div>
</body>
</html>
